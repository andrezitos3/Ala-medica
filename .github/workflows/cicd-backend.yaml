name: CI/CD Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deseja fazer deploy após o build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'


jobs:

  build-and-test:
    runs-on: server01
    if: github.event_name != 'workflow_dispatch' || contains(fromJson('["andrezitos3","LeonardoOziro"]'), github.actor)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build 🔨
        run: mvn compile
        working-directory: ./BackEnd

      - name: Run Unit Tests ✅
        run: mvn test
        working-directory: ./BackEnd
      
      - name: Instalando e validando dependencias 🤔
        run: mvn clean install
        working-directory: ./BackEnd

      - name: Limpando artefatos e dependências 🧼
        shell: powershell
        run: |
            Remove-Item -Recurse -Force "${{ github.workspace }}\BackEnd\target"
            Remove-Item -Recurse -Force "$env:USERPROFILE\.m2\repository"

  sonarqube-gate:
    runs-on: server01
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarQube Scan 🔍
        working-directory: ./BackEnd
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
            mvn verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG_KEY }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${SONAR_TOKEN}



  docker-build:
    runs-on: server01
    needs: [sonarqube-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image 🐳
        run: |
            docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }} \
            ./BackEnd

  trivy-scan-imagem:
    runs-on: server01
    needs: docker-build
    steps:
      - uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/alamedica-backend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  docker-push:
    runs-on: server01
    needs: trivy-scan-imagem
    steps:
      - name: Login to DockerHub 🐳
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to DockerHub 🐳
        run: |
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}

  deploy:
    runs-on: server01
    needs: docker-push
    if: ${{ github.event.inputs.deploy == 'true' }}
    steps:
      - name: Deploy to cluster ☸️
        run: |
          echo "fazer kubectl apply -f deployment.yaml etc"
          # configurar depois
