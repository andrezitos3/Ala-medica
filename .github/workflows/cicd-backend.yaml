name: CI/CD Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deseja fazer deploy após o build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'


jobs:

  build-and-test:
    runs-on: server01
    if: github.event_name != 'workflow_dispatch' || contains(fromJson('["andrezitos3","LeonardoOziro"]'), github.actor)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build 🔨
        run: mvn compile
        working-directory: ./BackEnd

      - name: Run Unit Tests ✅
        run: mvn test
        working-directory: ./BackEnd
      
      - name: Instalando e validando dependencias 🤔
        run: mvn clean install
        working-directory: ./BackEnd

      - name: Limpando artefatos e dependências 🧼
        shell: powershell
        run: |
            Remove-Item -Recurse -Force "${{ github.workspace }}\BackEnd\target"
            Remove-Item -Recurse -Force "$env:USERPROFILE\.m2\repository"

  sonarqube-gate:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Verificando projeto e gerando arquivos para análise 🤔
        run: mvn clean verify
        working-directory: ./BackEnd

      - name: SonarCloud Scan 🔍
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG_KEY }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=BackEnd/src/main/java
            -Dsonar.tests=BackEnd/src/test/java
            -Dsonar.java.binaries=BackEnd/target/classes
            -Dsonar.junit.reportPaths=BackEnd/target/surefire-reports
            -Dsonar.coverage.jacoco.xmlReportPaths=BackEnd/target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  docker-build:
    runs-on: server01
    needs: [sonarqube-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image 🐳

        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }} .


  trivy-scan-imagem:
    runs-on: server01
    needs: docker-build
    steps:
      - name: checkout repo 
        uses: actions/checkout@v4
      
      - name: Scan de vulnerabilidades com Trivy 🧐
        run: |
            trivy image --format table --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest

      - name: Limpando cache do Trivy 🧹
        run: trivy clean --all

  docker-push-and-clean:
    runs-on: server01
    needs: trivy-scan-imagem
    steps:
      - name: Login to DockerHub 🐳
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to DockerHub 🐳
        run: |
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}
      
      - name: Limpando a imagem do servidor 🧹
        run: |
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}

  deploy:
    runs-on: server01
    needs: docker-push-and-clean
    if: ${{ github.event.inputs.deploy == 'true' }}
    steps:
      - name: Deploy to cluster ☸️
        run: |
          echo "fazer kubectl apply -f deployment.yaml etc"
          # configurar depois
